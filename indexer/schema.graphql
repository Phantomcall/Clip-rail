# Cliprail indexer schema (playbook P-2.4). Mirrors web/lib/types.ts; web/lib/queries.ts reads it.
# Token amounts are USDC units (6 decimals) as BigInt; times are unix seconds.
# Handlers live in src/handlers/; config.yaml lists the events.

enum CampaignStatus {
  Active
  Closed
}

enum ClipStatus {
  Pending
  Active
  Flagged
  Rejected
  Ended
}

type Campaign {
  id: ID! # campaignId
  brand: String! @index
  token: String!
  budget: BigInt!
  reserved: BigInt!
  paid: BigInt!
  cpm: BigInt!
  maxPerClip: BigInt!
  maxViewsPerReport: BigInt!
  minLikeBps: Int!
  holdSecs: Int!
  startsAt: Int!
  endsAt: Int!
  minTier: Int!
  briefHash: String!
  status: CampaignStatus!
  clipsCount: Int!
  # Views actually paid (capped views are never paid, so this can be below the clips' YouTube totals)
  verifiedViews: BigInt!
  createdAt: Int!
  clips: [Clip!]! @derivedFrom(field: "campaign")
}

type Clip {
  id: ID! # clipId
  campaign: Campaign!
  clipper: Clipper!
  videoId: String! @index
  status: ClipStatus!
  lastViews: BigInt!
  likes: BigInt!
  accrued: BigInt!
  released: BigInt!
  registeredAt: Int!
  flaggedAt: Int
  releaseFailures: Int! # payouts that bounced (e.g. a blacklisted payout address); retried on the next release
  # Reports the like floor marked suspect (accrued nothing)
  suspectReports: Int!
  receipts: [Receipt!]! @derivedFrom(field: "clip")
}

type Clipper {
  id: ID! # address (lowercase)
  paidViews: BigInt!
  earned: BigInt!
  clipsPaid: Int!
  rejections: Int!
  brands: Int!
  tier: Int!
  firstSeen: Int!
  clips: [Clip!]! @derivedFrom(field: "clipper")
}

# One row per (clipper, brand) the clipper has earned from; drives Clipper.brands.
type ClipperBrand {
  id: ID! # clipper-brand
}

# One ViewsVerified event = one VerifiedView receipt.
type Receipt {
  id: ID! # txHash-logIndex
  clip: Clip!
  campaign: Campaign!
  clipper: Clipper!
  round: BigInt!
  totalViews: BigInt!
  deltaViews: BigInt! # velocity-capped delta from the event
  paidViews: BigInt! # views this receipt actually paid (same formula as the vault's tranche)
  likes: BigInt!
  amount: BigInt!
  unlockAt: Int!
  timestamp: Int!
  txHash: String!
}

type Payout {
  id: ID! # txHash-logIndex
  clip: Clip!
  clipper: Clipper!
  amount: BigInt!
  timestamp: Int!
  txHash: String!
}

# Per-brand dispute record, so clippers can see how a brand treats clips before joining (audit R-4).
type Brand {
  id: ID! # address (lowercase)
  campaigns: Int!
  clipsEarning: Int! # distinct clips that earned in this brand's campaigns
  flags: Int!
  rejects: Int!
  returned: BigInt! # earnings taken back by rejects
}

type Flag {
  id: ID! # clipId
  clip: Clip!
  brand: String!
  statusBefore: ClipStatus! # Active or Ended: what an accepted flag restores
  reasonHash: String!
  deadline: Int!
  resolved: Boolean!
  rejected: Boolean
  returned: BigInt
}

# Singleton "global" row for landing-page totals.
type Totals {
  id: ID!
  campaigns: Int!
  clippers: Int!
  verifiedViews: BigInt!
  paid: BigInt!
  payouts: Int!
}

type DailyStat {
  id: ID! # YYYY-MM-DD
  views: BigInt!
  paid: BigInt!
  receipts: Int!
}
