# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
# Cliprail indexer (playbook P-2.4). Mirrors CampaignVault + CreatorReputation into the entities in schema.graphql.
# Addresses and start blocks come from env (set them from packages/abi/addresses.json after Isaac's deploy):
#   ENVIO_VAULT_10143, ENVIO_REPUTATION_10143, ENVIO_START_BLOCK_10143
# Mainnet (143) is added in the production deployment (P-7.1).
name: cliprail-indexer
description: Cliprail campaigns, clips, view receipts and payouts on Monad
field_selection:
  transaction_fields:
    - hash
contracts:
  - name: CampaignVault
    abi_file_path: ../packages/abi/CampaignVault.json
    events:
      - event: CampaignCreated
      - event: CampaignToppedUp
      - event: CampaignClosed
      - event: CampaignRefunded
      - event: ClipRegistered
      - event: ClipActivated
      - event: ClipRejected
      - event: ClipEnded
      - event: ViewsVerified
      - event: SuspectReport
      - event: Flagged
      - event: Resolved
      - event: Released
      - event: ReleaseFailed
  - name: CreatorReputation
    abi_file_path: ../packages/abi/CreatorReputation.json
    events:
      - event: ReputationUpdated
chains:
  - id: 10143
    start_block: ${ENVIO_START_BLOCK_10143}
    contracts:
      - name: CampaignVault
        address: "${ENVIO_VAULT_10143}"
      - name: CreatorReputation
        address: "${ENVIO_REPUTATION_10143}"
