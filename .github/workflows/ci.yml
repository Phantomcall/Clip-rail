# CI for every pull request and every push to main. Make the jobs required checks in
# Settings → Branches → main so nothing merges red.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: no secrets committed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: No env files tracked
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$' || true)
          if [ -n "$bad" ]; then echo "::error::Env files must not be committed:"; echo "$bad"; exit 1; fi
      - name: No API keys or private keys in tracked files
        run: |
          # Google API keys, PEM private keys, and 64-hex values assigned to *_PK / *PRIVATE_KEY.
          hits=$(git grep -nIE 'AIza[0-9A-Za-z_-]{35}|-----BEGIN [A-Z ]*PRIVATE KEY-----|(_PK|PRIVATE_KEY)[[:space:]]*[=:][[:space:]]*"?(0x)?[0-9a-fA-F]{64}' -- . ':!pnpm-lock.yaml' || true)
          if [ -n "$hits" ]; then echo "::error::Possible secret committed:"; echo "$hits" | cut -c1-120; exit 1; fi

  js:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Build web
        run: pnpm --filter @cliprail/web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  oracle:
    name: CRE oracle compiles to WASM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile --filter "@cliprail/cre-oracle..."
      # Same compiler the CRE CLI uses; it also rejects APIs the workflow runtime doesn't have.
      - name: Compile workflow
        working-directory: cre/oracle
        run: bun x cre-compile main.ts "$RUNNER_TEMP/oracle.wasm"

  contracts:
    name: forge fmt, build, test (10k fuzz), ABI in sync
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3 # pinned: fmt output and the compiler pipeline must match local
      - name: forge fmt --check
        run: forge fmt --check
      # EIP-170 only binds what we deploy; test harnesses that subclass the vault are skipped.
      - name: forge build (contract sizes)
        run: forge build --sizes --skip test
      # FOUNDRY_PROFILE=ci: 10,000 fuzz runs and deeper invariant runs (PRD §9.1 F4).
      - name: forge test (ci profile)
        run: forge test -vvv
        env:
          FOUNDRY_PROFILE: ci
      # packages/abi must be regenerated from the contracts, never edited by hand or left stale.
      - name: ABI in packages/abi matches the contracts
        run: |
          ./scripts/export-abi.sh
          git diff --exit-code -- ../packages/abi || { echo "::error::packages/abi is stale. Run contracts/scripts/export-abi.sh and commit."; exit 1; }

  slither:
    name: slither (fail on medium or higher)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install slither-analyzer==0.11.6
      # Intentional findings are suppressed inline with a reason (slither-disable-next-line); see slither.config.json.
      - name: slither
        run: slither . --config-file slither.config.json --fail-medium
