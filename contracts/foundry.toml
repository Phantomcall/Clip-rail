[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true # ViewsVerified has 9 fields; legacy codegen runs out of stack
# Sourcify / Monadscan verification (PRD §6)
bytecode_hash = "none"
use_literal_content = true
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 256
depth = 50

# CI: ≥ 10k fuzz runs (PRD §9.1 F4)
[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 500
depth = 100

[rpc_endpoints]
monadTestnet = "${MONAD_TESTNET_RPC}"
monad = "${MONAD_MAINNET_RPC}"

[etherscan]
monad = { key = "${MONADSCAN_API_KEY}", chain = 143, url = "https://api.monadscan.com/api" }

[fmt]
ignore = ["src/cre/**"] # Chainlink files stay verbatim
line_length = 120
